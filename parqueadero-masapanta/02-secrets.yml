# PLANTILLA -- no contiene valores reales a propósito (evita subir secretos
# reales a git, mismo motivo por el que .env está en .gitignore y solo se
# versiona .env.example). Antes de aplicar el resto de deployment/, generar
# la versión real reemplazando los placeholders, por ejemplo:
#
#   kubectl create secret generic parqueadero-secrets -n parqueadero \
#     --from-literal=JWT_SECRET="$(grep -m1 ^JWT_SECRET ../.env.example | cut -d= -f2)" \
#     --from-literal=SUPABASE_DB_PASSWORD="<password real de Supabase>" \
#     --dry-run=client -o yaml > 02-secrets.local.yml
#   kubectl create secret generic kong-db-secret -n parqueadero \
#     --from-literal=KONG_PG_PASSWORD="kong123" \
#     --dry-run=client -o yaml >> 02-secrets.local.yml
#
# y aplicar 02-secrets.local.yml (nombre ya cubierto por .gitignore) en vez
# de este archivo. Ver deployment/README.md para el flujo completo.
apiVersion: v1
kind: Secret
metadata:
  name: parqueadero-secrets
  namespace: parqueadero-masapanta
type: Opaque
stringData:
  JWT_SECRET: "REEMPLAZAR_con_el_mismo_secreto_de_.env.example"
  SUPABASE_DB_PASSWORD: "REEMPLAZAR_con_el_password_real_de_supabase"
---
apiVersion: v1
kind: Secret
metadata:
  name: kong-db-secret
  namespace: parqueadero-masapanta
type: Opaque
stringData:
  KONG_PG_PASSWORD: "REEMPLAZAR_password_de_kong-db"

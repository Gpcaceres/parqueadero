apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-audit
  namespace: parqueadero-caceres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-audit
  template:
    metadata:
      labels:
        app: ms-audit
    spec:
      # Reemplaza a "depends_on: rabbitmq: condition: service_healthy" de
      # docker-compose: evita que el consumidor de la cola arranque antes de
      # que RabbitMQ acepte conexiones.
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo esperando rabbitmq; sleep 2; done"]
      containers:
        - name: ms-audit
          image: ms-audit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              value: "docker"
            - name: PORT
              value: "3004"
            - name: DB_HOST
              value: "aws-1-us-west-2.pooler.supabase.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres.wxjxviqtqyrzflxaidur"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: SUPABASE_DB_PASSWORD }
            - name: DB_NAME
              value: "audit_db"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: RABBITMQ_QUEUE
              value: "audit_queue"
            - name: RABBITMQ_EXCHANGE
              value: "audit_exchange"
            - name: RABBITMQ_ROUTING_KEY
              value: "audit.event"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: JWT_SECRET }
            - name: THROTTLE_TTL
              value: "60"
            - name: THROTTLE_LIMIT
              value: "10"
          readinessProbe:
            httpGet: { path: /, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: 3004 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "200m" }
---
apiVersion: v1
kind: Service
metadata:
  name: ms-audit
  namespace: parqueadero-caceres
spec:
  selector:
    app: ms-audit
  ports:
    - port: 3004
      targetPort: 3004

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehiculos
  namespace: parqueadero-caceres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehiculos
  template:
    metadata:
      labels:
        app: vehiculos
    spec:
      # Reemplaza a "depends_on: rabbitmq: condition: service_healthy" de
      # docker-compose: sin esto, el proceso Node se cae con una excepción no
      # capturada si RabbitMQ todavía no acepta conexiones al arrancar
      # (ver EventPublisher), entrando en CrashLoopBackOff en vez de esperar.
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo esperando rabbitmq; sleep 2; done"]
      containers:
        - name: vehiculos
          image: vehiculos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "docker"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "aws-1-us-west-2.pooler.supabase.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_USUARIO
              value: "postgres.wxjxviqtqyrzflxaidur"
            - name: DB_CONTRASENA
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: SUPABASE_DB_PASSWORD }
            - name: DB_NOMBRE
              value: "vehiculos_db"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: RABBITMQ_EXCHANGE
              value: "audit_exchange"
            - name: RABBITMQ_ROUTING_KEY
              value: "audit.event"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "200m" }
---
apiVersion: v1
kind: Service
metadata:
  name: vehiculos
  namespace: parqueadero-caceres
spec:
  selector:
    app: vehiculos
  ports:
    - port: 3000
      targetPort: 3000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-db
  namespace: parqueadero-caceres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-db
  template:
    metadata:
      labels:
        app: kong-db
    spec:
      containers:
        - name: kong-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "kong"
            - name: POSTGRES_USER
              value: "kong"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: KONG_PG_PASSWORD
          volumeMounts:
            - name: kong-db-storage
              mountPath: /var/lib/postgresql/data
          # tcpSocket en vez de "pg_isready" (exec): mismo motivo que en
          # rabbitmq/kong -- un exec probe le pide al runtime lanzar un
          # proceso nuevo en cada chequeo, caro bajo carga.
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: kong-db-storage
          persistentVolumeClaim:
            claimName: kong-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kong-db-pvc
  namespace: parqueadero-caceres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kong-db
  namespace: parqueadero-caceres
spec:
  selector:
    app: kong-db
  ports:
    - port: 5432
      targetPort: 5432

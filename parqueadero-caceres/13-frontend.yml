apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: parqueadero-caceres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /login.html, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login.html, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "150m" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: parqueadero-caceres
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP # el Ingress se encarga de exponerlo

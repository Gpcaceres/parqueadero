# ============================================
# Parqueadero - Front-end
# ============================================
# Sirve la app estática (login + panel autenticado, front-end/app/) por su
# cuenta, como un despliegue independiente del back-end. El navegador llama a
# Kong directamente en localhost:8000, así que este contenedor no necesita la
# red del back-end para funcionar; se une igual a "parqueadero-network"
# (creada por el compose del back-end) para que ambos stacks queden
# agrupados como un mismo despliegue lógico en Docker Desktop.
# ============================================

name: parqueadero-front-end

services:
  app:
    image: nginx:alpine
    container_name: parqueadero-app
    ports:
      - "8085:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx-no-cache.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - parqueadero-network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explícito, no "localhost": wget resuelve "localhost" a ::1
      # (IPv6) antes que 127.0.0.1 en este entorno, y nginx solo escucha en
      # IPv4 (0.0.0.0:80) -- con "localhost" el healthcheck fallaba siempre
      # con "Connection refused" aunque el sitio respondiera bien por fuera.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  parqueadero-network:
    external: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: asignacion-trazabilidad
  namespace: parqueadero-buestan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asignacion-trazabilidad
  template:
    metadata:
      labels:
        app: asignacion-trazabilidad
    spec:
      # Reemplaza a "depends_on: rabbitmq: condition: service_healthy" de
      # docker-compose: sin esto, el proceso Node se cae con una excepción no
      # capturada si RabbitMQ todavía no acepta conexiones al arrancar
      # (ver EventPublisher), entrando en CrashLoopBackOff en vez de esperar.
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo esperando rabbitmq; sleep 2; done"]
      containers:
        - name: asignacion-trazabilidad
          image: asignacion-trazabilidad:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: "docker"
            - name: PORT
              value: "3002"
            - name: DB_HOST
              value: "aws-1-us-west-2.pooler.supabase.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres.wxjxviqtqyrzflxaidur"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: SUPABASE_DB_PASSWORD }
            - name: DB_NAME
              value: "asignacion_db"
            - name: VEHICLE_SERVICE_URL
              value: "http://vehiculos:3000"
            - name: USER_SERVICE_URL
              value: "http://personas:3001"
            - name: ZONE_SERVICE_URL
              value: "http://zonas:8080"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: RABBITMQ_EXCHANGE
              value: "audit_exchange"
            - name: RABBITMQ_ROUTING_KEY
              value: "audit.event"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: JWT_SECRET }
          # Mismo endpoint de salud dedicado que ya usa docker-compose.yml.
          readinessProbe:
            httpGet: { path: /api/asignaciones/health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/asignaciones/health, port: 3002 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "200m" }
---
apiVersion: v1
kind: Service
metadata:
  name: asignacion-trazabilidad
  namespace: parqueadero-buestan
spec:
  selector:
    app: asignacion-trazabilidad
  ports:
    - port: 3002
      targetPort: 3002

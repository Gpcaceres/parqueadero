apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: parqueadero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
          # RABBITMQ_VM_MEMORY_HIGH_WATERMARK (env var) está deprecada en esta
          # imagen y la rechaza al arrancar (exit inmediato) -- en vez de eso
          # se resuelve solo con más memoria límite abajo (1Gi en vez de
          # 512Mi), suficiente margen para que el watermark por defecto
          # (40% relativo) no salte con el management plugin + Erlang VM.
          # "rabbitmq-diagnostics" (exec probe) obliga al runtime a lanzar un
          # proceso nuevo dentro del contenedor en cada chequeo -- bajo carga
          # eso puede tardar más que el timeout y kubelet mata el pod
          # creyéndolo caído, aunque el broker esté bien. Un tcpSocket es
          # mucho más liviano (solo abre una conexión TCP, sin exec) y es
          # suficiente para saber si el broker acepta conexiones AMQP.
          livenessProbe:
            tcpSocket: { port: 5672 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket: { port: 5672 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: parqueadero
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
